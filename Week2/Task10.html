<!-- Create a program that makes an API call and displays all the retrieved data on a web page. Choose a public API (e.g.,
JSONPlaceholder, OpenWeatherMap) and use the fetch function to make the API request. Also implement error handling -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API call</title>
</head>
<body>
  <h3>Async & Await</h3>
  <button onclick="get()">Show</button>
  <p id="error" class="error"></p>

  <table id="data">
    <thead>
      <tr>
        <th>Post ID</th>
        <th>Post Title</th>
        <th>Post Body</th>
      </tr>
    </thead>
    <tbody></tbody> 
  </table>

  <script>
    async function get() {
      const errorElement = document.getElementById("error");
      const tableBody = document.querySelector("#data tbody"); 

      try {
        errorElement.textContent = ""; 
        tableBody.innerHTML = ""; 

        const response = await fetch('https://jsonplaceholder.typicode.com/posts');
        if (!response.ok) {
          throw new Error(`HTTP Error! Status: ${response.status} - ${response.statusText}`);
        }

        const posts = await response.json();

        posts.forEach((item) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.title}</td>
            <td>${item.body}</td>
          `;
          tableBody.appendChild(row);
        });

      } catch (err) {
        console.error('Error:', err);
        errorElement.textContent = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
